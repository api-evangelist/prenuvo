name: Prenuvo
description: >-
  Prenuvo operates a preventive healthcare screening service built around
  whole-body MRI imaging paired with blood biomarker panels and personalized
  results reviews. A single scan captures on the order of a billion data points
  while screening for hundreds of conditions across major organ systems, without
  radiation or contrast agents, and completes in under an hour. Blood panels
  measure 80+ biomarkers tied to inflammation, hormone levels, and metabolic
  health, with optional advanced imaging for brain, heart, and body composition.
  Prenuvo runs clinics across the US, Canada, Australia, and the UK, and works
  with research institutions including Mount Sinai, UCLA, Johns Hopkins,
  Stanford, and Penn. Prenuvo does not currently publish a public developer API,
  developer portal, or SDKs; this profile captures its public identity and
  domain-security posture for the API Evangelist network.
